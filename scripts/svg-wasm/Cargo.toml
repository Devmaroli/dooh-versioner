[package]
name = "dooh-vectorcraft-spike"
version = "0.1.0"
edition = "2024"
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
vectorcraft-svg = { path = "../vectorcraft/crates/svg", optional = true }
vectorcraft-render = { path = "../vectorcraft/crates/render", optional = true }
wasm-bindgen = "0.2"
vectorcraft-doc = { path = "../vectorcraft/crates/doc", optional = true }
kurbo = { version = "0.13", optional = true }
serde_json = { version = "1", optional = true }
[features]
svg = ["dep:vectorcraft-svg", "dep:serde_json"]
render = ["dep:vectorcraft-render", "dep:vectorcraft-doc", "dep:kurbo", "dep:serde_json"]
[profile.release]
opt-level = "s"
lto = true
